name: Release

# Stage 1 (workflow_dispatch on main): build, test and upload the release assets.
# Stage 2 (release environment approval): tag the built commit and publish those
# exact assets. Rejecting the deployment stops the run before any tag or release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare candidate
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Require the default branch and a first attempt
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Release candidates must be built from $DEFAULT_BRANCH, not $GITHUB_REF." >&2
            exit 1
          fi
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "Reruns cannot become release candidates; start a new manual workflow run." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine release version
        id: version
        run: |
          tag="$(python3 tools/release_candidate.py version)"
          echo "Candidate $tag from $GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test release candidate tooling
        run: python3 tests/test_release_candidate.py

  validation:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  flatpak:
    needs: [prepare, validation]
    name: Build Flatpak
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.ChrisLauinger.MprisMiniPlayer.yml
          bundle: MPRIS-MiniPlayer-${{ needs.prepare.outputs.tag }}-x86_64.flatpak
          arch: x86_64
          cache-key: flatpak-builder-${{ github.sha }}
          verbose: true
          run-tests: true

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-flatpak
          path: MPRIS-MiniPlayer-${{ needs.prepare.outputs.tag }}-x86_64.flatpak
          if-no-files-found: error

  debian:
    needs: [prepare, validation]
    name: Build Debian package
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            build-essential \
            debhelper \
            desktop-file-utils \
            dbus-daemon \
            python3 \
            devscripts \
            gettext \
            libadwaita-1-dev \
            libgtk-4-dev \
            libsoup-3.0-dev \
            meson \
            ninja-build \
            valac

      - name: Build amd64 Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Normalize Debian package name
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p release-assets
          cp ../mpris-miniplayer_*_amd64.deb "release-assets/mpris-miniplayer_${TAG}_amd64.deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-debian
          path: release-assets/mpris-miniplayer_${{ needs.prepare.outputs.tag }}_amd64.deb
          if-no-files-found: error

  rpm:
    needs: [prepare, validation]
    name: Build RPM package
    runs-on: ubuntu-26.04
    container:
      image: fedora:46

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            desktop-file-utils \
            dbus-daemon \
            python3 \
            gcc \
            gettext \
            git \
            gtk4-devel \
            libadwaita-devel \
            libsoup3-devel \
            meson \
            rpm-build \
            vala

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build x86_64 RPM package
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version="${TAG#v}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/rpmbuild/SOURCES"
          git archive \
            --format=tar.gz \
            --prefix="mpris-miniplayer-${version}/" \
            --output="$HOME/rpmbuild/SOURCES/mpris-miniplayer-${version}.tar.gz" \
            HEAD
          rpmbuild -bb \
            --define "pkg_version ${version}" \
            rpm/mpris-miniplayer.spec
          mkdir -p release-assets
          cp "$HOME"/rpmbuild/RPMS/x86_64/mpris-miniplayer-"${version}"-*.x86_64.rpm \
            "release-assets/mpris-miniplayer-${TAG}.x86_64.rpm"

      - name: Upload RPM package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-rpm
          path: release-assets/mpris-miniplayer-${{ needs.prepare.outputs.tag }}.x86_64.rpm
          if-no-files-found: error

  aggregate:
    needs: [prepare, flatpak, debian, rpm]
    name: Aggregate release candidate
    runs-on: ubuntu-26.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets

      - name: Require all packages and generate SHA256SUMS
        run: python3 tools/release_candidate.py aggregate --dist release-assets

      - name: Upload release candidate
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Explain how to approve or reject the release
        env:
          RELEASE_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: python3 tools/release_candidate.py summary

  publish:
    needs: [prepare, aggregate]
    name: Publish release
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: ${{ needs.aggregate.outputs.artifact_url }}
    permissions:
      contents: write

    steps:
      - name: Checkout built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download approved artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.aggregate.outputs.artifact_id }}
          path: release-assets

      - name: Verify checksums, tag the built commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 tools/release_candidate.py publish --dist release-assets
