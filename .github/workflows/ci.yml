name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build valac \
            libgtk-4-dev libadwaita-1-dev libsoup-3.0-dev \
            gettext desktop-file-utils appstream dbus-daemon python3
      - name: Check release metadata
        run: |
          python3 tools/check-release.py
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 tools/check-release.py --tag "$GITHUB_REF_NAME"
          fi
      - name: Build and test, including a private D-Bus session
        run: |
          meson setup build-ci --buildtype=debug
          meson compile -C build-ci
          meson test -C build-ci --print-errorlogs
      - name: Validate desktop metadata and translations
        run: |
          desktop-file-validate build-ci/data/io.github.ChrisLauinger.MprisMiniPlayer.desktop
          appstreamcli validate --no-net build-ci/data/io.github.ChrisLauinger.MprisMiniPlayer.metainfo.xml
          for catalog in po/*.po; do msgfmt --check "$catalog" -o /dev/null; done
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: build-ci/meson-logs/testlog.junit.xml
          if-no-files-found: ignore
